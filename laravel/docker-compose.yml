# Gateway stack: app + nginx + postgres + redis
# Requires external network: docker network create internal-assistant-net
# Ensure ml-api is running on the same network.
# Config: .env (see .env.example)

services:
  app:
    build: .
    container_name: ${LARAVEL_APP_CONTAINER:-ia-laravel-app}
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal-assistant-net
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: ${LARAVEL_NGINX_CONTAINER:-ia-laravel-nginx}
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - internal-assistant-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ${LARAVEL_POSTGRES_CONTAINER:-ia-laravel-postgres}
    env_file:
      - .env
    environment:
      # Postgres image expects these names (значения из .env через подстановку)
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - laravel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal-assistant-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ${LARAVEL_REDIS_CONTAINER:-ia-laravel-redis}
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal-assistant-net
    restart: unless-stopped

volumes:
  laravel_pgdata:

networks:
  internal-assistant-net:
    external: true
    name: ${DOCKER_NETWORK:-internal-assistant-net}
